<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#203c32" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sesame" />
    <meta
      name="description"
      content="Your Sesame owner portal. Explore facilities, choose a time and manage your bookings."
    />
    <title>Sesame · Resident portal</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/apple-touch-icon-blue.png"
    />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app">
      <div class="boot-screen">
        <span class="brand-mark">S</span>
        <p>Welcome to Sesame</p>
        <span class="spinner" aria-label="Loading"></span>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
    <noscript
      ><p class="no-script">
        Please enable JavaScript to use the resident portal.
      </p></noscript
    >
  </body>
</html>
