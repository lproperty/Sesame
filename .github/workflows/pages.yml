name: Verify and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source without saving credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check public source for private files and credential patterns
        run: npm run audit:publication
      - name: Run syntax, application and security tests
        run: npm run check
      - name: Verify an example build without deployment settings
        run: npm run build:pages

  # Tests execute npm dependencies. Build the production artifact from a fresh
  # checkout on a different runner, with no dependency install or shared cache.
  build:
    if: github.repository == 'lproperty/Sesame' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment: pages-build
    steps:
      - name: Check out the verified commit without saving credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js without dependency caching
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check the clean source for private files
        run: node scripts/audit-publication.mjs
      - name: Build and verify the live frontend artifact
        env:
          SESAME_SITE_CONFIG: ${{ secrets.SESAME_SITE_CONFIG }}
        run: node scripts/build-pages.mjs --live
      # Package directly so no composite action can fetch a mutable nested tag.
      - name: Package only the verified website
        run: tar --directory dist --create --file "$RUNNER_TEMP/artifact.tar" .
      - name: Upload the immutable Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: false

  deploy:
    if: github.repository == 'lproperty/Sesame' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages using a short-lived identity
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
